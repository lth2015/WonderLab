<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四时 · 册页插画</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e9e9df;color:#344541;font:14px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:25px;font-weight:500;margin:0}p{margin:5px 0 20px;color:#61716a}.pages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:22px 16px}figure{margin:0}img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain}figcaption{margin-top:7px}.name{font-size:16px}.line{display:block;font-size:12px;color:#61716a}a{color:inherit;text-decoration:none}@media(max-width:900px){.pages{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:540px){.pages{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<main>
  <h1>四时</h1>
  <p>同一片湖，许多可以停留的光阴。册页插画提案，供场景取意。</p>
  <div class="pages">
    <figure><a href="willow.webp"><img src="willow.webp" alt="晴日垂柳与宽湖"></a><figcaption><span class="name">春 · 柳</span><span class="line">晴光入柳，风过水明</span></figcaption></figure>
    <figure><a href="blossom.webp"><img src="blossom.webp" alt="春花轻落水面"></a><figcaption><span class="name">春 · 落花</span><span class="line">落花轻点一湖春</span></figcaption></figure>
    <figure><a href="rainbow.webp"><img src="rainbow.webp" alt="雨后远山上有一道淡虹"></a><figcaption><span class="name">春 · 虹</span><span class="line">雨后初晴，一虹过山</span></figcaption></figure>
    <figure><a href="lotus.webp"><img src="lotus.webp" alt="长日荷塘为水留荫"></a><figcaption><span class="name">夏 · 荷</span><span class="line">接天莲叶无穷碧</span></figcaption></figure>
    <figure><a href="storm.webp"><img src="storm.webp" alt="远山电光与湖上细雨"></a><figcaption><span class="name">夏 · 雷雨</span><span class="line">远山雷雨，近水听声</span></figcaption></figure>
    <figure><a href="magpie.webp"><img src="magpie.webp" alt="喜鹊从夜色柳冠间飞出"></a><figcaption><span class="name">夏 · 惊鹊</span><span class="line">明月别枝惊鹊</span></figcaption></figure>
    <figure><a href="cicada.webp"><img src="cicada.webp" alt="深蓝暖夜里清风过柳"></a><figcaption><span class="name">夏 · 鸣蝉</span><span class="line">清风半夜鸣蝉</span></figcaption></figure>
    <figure><a href="fireflies.webp"><img src="fireflies.webp" alt="夏夜低草间的微弱萤光"></a><figcaption><span class="name">夏 · 萤火</span><span class="line">夏夜流萤，草间微光</span></figcaption></figure>
    <figure><a href="galaxy.webp"><img src="galaxy.webp" alt="自然银河斜过远山与湖"></a><figcaption><span class="name">夏 · 星河</span><span class="line">满船清梦压星河</span></figcaption></figure>
    <figure><a href="autumn.webp"><img src="autumn.webp" alt="暮色枫叶随风落水"></a><figcaption><span class="name">秋 · 秋</span><span class="line">秋风过岸，落叶归水</span></figcaption></figure>
    <figure><a href="moonlit.webp"><img src="moonlit.webp" alt="画外月光在湖上留下银路"></a><figcaption><span class="name">秋 · 月</span><span class="line">月色入水，清辉满湖</span></figcaption></figure>
    <figure><a href="lanterns.webp"><img src="lanterns.webp" alt="三盏小河灯远近相随"></a><figcaption><span class="name">秋 · 河灯</span><span class="line">一盏河灯，照见晚水</span></figcaption></figure>
    <figure><a href="shower.webp"><img src="shower.webp" alt="清寒夜空里的细小流星"></a><figcaption><span class="name">冬 · 流星</span><span class="line">流星过夜，水接微光</span></figcaption></figure>
    <figure><a href="moonsnow.webp"><img src="moonsnow.webp" alt="雪在月色与裸枝之间落下"></a><figcaption><span class="name">冬 · 雪</span><span class="line">月下飘雪，山水无声</span></figcaption></figure>
  </div>
</main>
</html>
