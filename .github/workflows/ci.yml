# Every pull request and every push to main: the same checks that gate a
# merge locally (README), so a PR shows red or green on GitHub itself.
name: CI

on:
  pull_request:
  push:
    branches: [main, ci-fast]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 清明上河図：江戸編 (apps/qingming-edo): its own typecheck, tests and
      # build: `npm run build` already puts it in dist/edo/; this checks it
      # also builds for a domain of its own (spec §16).
      - run: npm run test:qingming
      - run: npm run edo:test
      - run: EDO_BASE=/ npm run edo:build

  db:
    name: Database tests
    # The dedicated ci-fast branch is for quick feedback while iterating.
    # Main and normal pull requests always retain the database gate.
    if: ${{ github.ref_name != 'ci-fast' && github.head_ref != 'ci-fast' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wonderlab_test
        ports: ['53307:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wonderlab:ci .
