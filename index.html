<!doctype html>
<html lang="zh-CN" style="background:#0B0E13">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <title>万象生 · WonderLab</title>
    <!--
      The loading state (docs/03 §11), inline so it is the very first frame:
      a drop of pale ink spreading on the dark ground, the line 一念起，万象生
      under it, and after 3 s a small 世界正在铺开…. The app dissolves it into
      the night sky once the world is ready (#boot.done).
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0e13;
        z-index: 50;
        transition: opacity 900ms cubic-bezier(0.55, 0, 1, 0.45);
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .ink {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 46vmin;
        height: 46vmin;
        margin: -23vmin 0 0 -23vmin;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(233, 228, 214, 0.16) 0%, rgba(233, 228, 214, 0.07) 38%, rgba(233, 228, 214, 0) 70%);
        animation: boot-ink 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot svg {
        position: absolute;
        left: 50%;
        top: calc(44% + 18vmin);
        width: min(260px, 60vw);
        transform: translateX(-50%);
        animation: boot-in 1.2s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot .slow {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(44% + 18vmin + 64px);
        margin: 0;
        text-align: center;
        font: 13px/1.6 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
        letter-spacing: 0.1em;
        color: #8e897f;
        animation: boot-in 0.8s 3s both;
      }
      @keyframes boot-ink {
        from {
          transform: scale(0.08);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ink,
        #boot svg {
          animation-duration: 1ms;
          animation-delay: 0s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="ink"></div>
      <svg viewBox="0 0 260 40" role="presentation">
        <text x="130" y="28" text-anchor="middle" fill="#efeadf" fill-opacity="0.86" font-size="22" letter-spacing="6" font-family="'Kaiti SC','STKaiti','KaiTi','LXGW WenKai',serif">一念起，万象生</text>
      </svg>
      <p class="slow">世界正在铺开…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
